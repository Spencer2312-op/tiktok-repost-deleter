<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Repost Deleter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="logo">Tik<span>Tok</span> Repost Deleter</div>

  <div class="count-badge" id="countBadge">
    <span class="count-number" id="countNumber">—</span>
    <span class="count-label" id="countLabel">checking reposts...</span>
  </div>

  <button id="deleteBtn" disabled>Delete All Reposts</button>

  <div class="progress-bar-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
